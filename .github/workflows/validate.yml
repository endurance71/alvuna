name: Validate

on:
  push:
  pull_request:
  schedule:
    - cron: "0 4 * * 1"

jobs:
  hassfest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: home-assistant/actions/hassfest@master

  hacs:
    runs-on: ubuntu-latest
    steps:
      - uses: hacs/action@main
        with:
          category: integration

  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci --no-audit --no-fund && node build.mjs
        working-directory: frontend
      # The built frontend is committed (an install from a plain commit must work too); it must match the sources.
      - name: Built frontend is up to date
        run: |
          git add -A custom_components/alvuna/www
          git diff --cached --exit-code --stat -- custom_components/alvuna/www ':!*.br' ':!*.gz' || {
            echo "::error::custom_components/alvuna/www is stale: run 'cd frontend && node build.mjs' and commit it"; exit 1; }
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - run: pip install -r requirements_test.txt
      - run: pytest -q
