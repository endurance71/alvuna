<script>
  // Drawn for 1920×1080: any other window (a browser on the Mac) is scaled to fit, the TV gets it 1:1.
  (function fit() {
    var z = Math.min(innerWidth / 1920, innerHeight / 1080);
    document.documentElement.style.zoom = z === 1 ? "" : z;
    addEventListener("resize", function () { var n = Math.min(innerWidth / 1920, innerHeight / 1080); document.documentElement.style.zoom = n; });
  })();
</script>
